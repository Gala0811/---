
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Своя игра</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1a3a6b 0%, #0a1a33 100%);
    color: #fff;
    min-height: 100vh;
    padding: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-size: 2rem;
    color: #ffd966;
    text-shadow: 0 0 15px rgba(255,217,102,0.5);
    margin-bottom: 10px;
    letter-spacing: 3px;
  }
  .top-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }
  .top-bar button {
    background: #ffd966;
    color: #0a1a33;
    border: none;
    padding: 8px 18px;
    border-radius: 30px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .top-bar button:hover { background: #ffe699; }
  .top-bar .finish-btn { background: #e74c3c; color: #fff; }
  .top-bar .finish-btn:hover { background: #c0392b; }

  /* Глобальный таймер игры */
  .game-timer {
    display: none;
    background: rgba(255,255,255,0.1);
    border: 2px solid #ffd966;
    border-radius: 30px;
    padding: 6px 20px;
    font-family: 'Courier New', monospace;
    font-size: 1.3rem;
    font-weight: bold;
    color: #ffd966;
  }
  .game-timer.active { display: inline-block; }
  .game-timer.warning {
    color: #ff6b6b;
    border-color: #ff6b6b;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  /* Настройка длительности */
  .game-setup {
    background: rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 10px 20px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .game-setup label { font-size: 0.9rem; cursor: pointer; }
  .game-setup input[type="number"] {
    width: 70px;
    padding: 5px 10px;
    border-radius: 8px;
    border: none;
    font-size: 0.95rem;
    text-align: center;
  }

  .teams {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 1200px;
  }
  .team {
    background: rgba(255,255,255,0.08);
    border: 2px solid #2a5a9b;
    border-radius: 16px;
    padding: 12px 18px;
    min-width: 160px;
    text-align: center;
    flex: 1;
    max-width: 220px;
  }
  .team-name {
    background: transparent;
    border: none;
    color: #ffd966;
    font-size: 1.1rem;
    font-weight: bold;
    text-align: center;
    width: 100%;
    outline: none;
    margin-bottom: 5px;
  }
  .team-score {
    font-size: 2rem;
    font-weight: bold;
    color: #fff;
    margin: 5px 0;
  }
  .team-score.negative { color: #ff6b6b; }
  .team-controls { display: flex; justify-content: center; gap: 6px; }
  .team-controls button {
    background: #2a5a9b;
    color: #fff;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
  }
  .team-controls button:hover { background: #3a7acb; }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 1200px;
    margin-bottom: 20px;
  }
  .cat-header {
    background: #1a3a6b;
    border: 2px solid #2a5a9b;
    border-radius: 10px;
    padding: 15px 8px;
    text-align: center;
    font-weight: bold;
    font-size: 1.1rem;
    color: #ffd966;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 70px;
  }
  .cell {
    background: linear-gradient(145deg, #1e4a8c, #153566);
    border: 2px solid #2a5a9b;
    border-radius: 10px;
    aspect-ratio: 1.4 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    font-weight: bold;
    color: #ffd966;
    cursor: pointer;
    transition: 0.15s;
    text-shadow: 0 0 8px rgba(255,217,102,0.4);
  }
  .cell:hover:not(.used) {
    background: linear-gradient(145deg, #2a5a9b, #1e4a8c);
    transform: scale(1.03);
    box-shadow: 0 0 20px rgba(255,217,102,0.4);
  }
  .cell.used {
    background: #0a1a33;
    color: #2a5a9b;
    cursor: default;
    text-shadow: none;
    border-color: #153566;
  }

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: linear-gradient(145deg, #1e4a8c, #0f2a52);
    border: 3px solid #ffd966;
    border-radius: 24px;
    padding: 30px;
    max-width: 850px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 60px rgba(255,217,102,0.3);
    max-height: 95vh;
    overflow-y: auto;
  }
  .modal-cat {
    color: #ffd966;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .modal-value {
    color: #ffd966;
    font-size: 1.5rem;
    font-weight: bold;
    margin-bottom: 15px;
  }

  .timer-block {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .timer-display {
    font-size: 2.5rem;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    background: #0a1a33;
    color: #ffd966;
    padding: 8px 25px;
    border-radius: 60px;
    min-width: 130px;
    border: 2px solid #2a5a9b;
  }
  .timer-display.warning {
    color: #ff6b6b;
    border-color: #ff6b6b;
    animation: pulse 1s infinite;
  }
  .timer-buttons {
    display: flex;
    gap: 8px;
  }
  .timer-buttons button {
    background: #2a5a9b;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 30px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .timer-buttons button:hover { background: #3a7acb; }

  .modal-question {
    font-size: 1.6rem;
    line-height: 1.5;
    margin-bottom: 20px;
    color: #fff;
    padding: 15px;
    background: rgba(0,0,0,0.2);
    border-radius: 16px;
  }
  .modal-answer {
    font-size: 1.4rem;
    color: #8fff9e;
    font-weight: bold;
    margin: 15px 0;
    padding: 18px;
    background: rgba(0,0,0,0.3);
    border-radius: 16px;
    display: none;
  }
  .modal-answer.show { display: block; }
  .modal-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 15px;
  }
  .modal-buttons button {
    background: #ffd966;
    color: #0a1a33;
    border: none;
    padding: 12px 22px;
    border-radius: 30px;
    font-weight: bold;
    cursor: pointer;
    font-size: 1rem;
  }
  .modal-buttons button:hover { background: #ffe699; }
  .modal-buttons .award-btn { background: #2ecc71; color: #fff; }
  .modal-buttons .award-btn:hover { background: #27ae60; }
  .modal-buttons .close-btn { background: #e74c3c; color: #fff; }
  .modal-buttons .close-btn:hover { background: #c0392b; }

  /* ФИНАЛЬНЫЙ ЭКРАН */
  .final-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, #1a3a6b 0%, #0a1a33 100%);
    z-index: 200;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow: hidden;
  }
  .final-screen.active { display: flex; }
  .final-content {
    background: linear-gradient(145deg, #1e4a8c, #0f2a52);
    border: 4px solid #ffd966;
    border-radius: 32px;
    padding: 40px;
    max-width: 700px;
    width: 100%;
    text-align: center;
    box-shadow: 0 0 80px rgba(255,217,102,0.5);
    position: relative;
    z-index: 2;
    animation: scaleIn 0.5s ease;
  }
  @keyframes scaleIn {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .final-title {
    font-size: 2.5rem;
    color: #ffd966;
    text-shadow: 0 0 20px rgba(255,217,102,0.6);
    margin-bottom: 20px;
  }
  .final-winner {
    font-size: 2rem;
    color: #fff;
    margin: 20px 0;
    padding: 20px;
    background: rgba(255,215,0,0.15);
    border-radius: 16px;
    border: 2px solid #ffd966;
  }
  .final-winner .crown { font-size: 3rem; display: block; margin-bottom: 10px; }
  .final-winner .name { color: #ffd966; font-weight: bold; }
  .final-winner .score { color: #8fff9e; font-size: 1.5rem; }
  .final-standings {
    margin: 25px 0;
    text-align: left;
  }
  .standing {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    margin: 8px 0;
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    font-size: 1.2rem;
  }
  .standing.first { background: rgba(255,215,0,0.25); border: 2px solid #ffd966; }
  .standing .place { font-size: 1.5rem; margin-right: 12px; }
  .standing .tname { flex: 1; }
  .standing .tscore { color: #ffd966; font-weight: bold; }
  .final-buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-top: 25px;
    flex-wrap: wrap;
  }
  .final-buttons button {
    background: #ffd966;
    color: #0a1a33;
    border: none;
    padding: 15px 30px;
    border-radius: 40px;
    font-weight: bold;
    cursor: pointer;
    font-size: 1.1rem;
  }
  .final-buttons button:hover { background: #ffe699; }

  /* Конфетти */
  .confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    background: #ffd966;
    animation: fall linear infinite;
    z-index: 1;
  }
  @keyframes fall {
    0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  @media (max-width: 700px) {
    h1 { font-size: 1.4rem; }
    .cell { font-size: 1.2rem; }
    .cat-header { font-size: 0.8rem; padding: 8px 4px; min-height: 50px; }
    .modal-content { padding: 20px; }
    .modal-question { font-size: 1.2rem; }
    .timer-display { font-size: 1.8rem; }
    .final-title { font-size: 1.8rem; }
    .final-winner { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<h1>🎯 СВОЯ ИГРА</h1>

<div class="top-bar">
  <button onclick="toggleFullscreen()">🖥️ На весь экран</button>
  <button onclick="resetGame()">🔄 Новая игра</button>
  <button onclick="finishGame()" class="finish-btn">🏆 Завершить игру</button>
  <div class="game-timer" id="gameTimer">⏱️ 30:00</div>
</div>

<div class="game-setup" id="gameSetup">
  <label>
    <input type="checkbox" id="useGameTimer">
    Ограничить игру по времени
  </label>
  <label>
    Длительность:
    <input type="number" id="gameDuration" value="30" min="5" max="180" step="5"> минут
  </label>
</div>

<div class="teams" id="teamsContainer"></div>
<div class="board" id="board"></div>

<!-- Модальное окно вопроса -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-cat" id="modalCat"></div>
    <div class="modal-value" id="modalValue"></div>

    <div class="timer-block">
      <div class="timer-display" id="timerDisplay">30</div>
      <div class="timer-buttons">
        <button onclick="pauseTimer()" id="pauseBtn">⏸ Пауза</button>
        <button onclick="resetTimer()">🔄 Заново</button>
      </div>
    </div>

    <div class="modal-question" id="modalQuestion"></div>
    <div class="modal-answer" id="modalAnswer"></div>
    <div class="modal-buttons" id="modalButtons"></div>
  </div>
</div>

<!-- Финальный экран -->
<div class="final-screen" id="finalScreen">
  <div class="final-content">
    <div class="final-title">🏆 ИГРА ОКОНЧЕНА 🏆</div>
    <div class="final-winner" id="finalWinner"></div>
    <div class="final-standings" id="finalStandings"></div>
    <div class="final-buttons">
      <button onclick="closeFinalAndReset()">🔄 Новая игра</button>
      <button onclick="closeFinal()">✖ Закрыть</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ВОПРОСЫ
   ============================================================ */
const GAME_DATA = [
  {
    category: "Советские фильмы",
    questions: [
      { q: "Как зовут главную героиню фильма «Девчата»?", a: "Тося (Тося Кислицына)" },
      { q: "Кто сыграл Новосельцева в «Служебном романе»?", a: "Андрей Мягков" },
      { q: "В каком фильме звучит песня «Куда уходит детство»?", a: "Карнавал" },
      { q: "Кто режиссёр фильма «Афоня»?", a: "Георгий Данелия" },
      { q: "Какая актриса сыграла главную роль в «Карнавале»?", a: "Ирина Муравьёва" }
    ]
  },
  {
    category: "Песни",
    questions: [
      { q: "«Калинка» — это русская народная песня. А кто написал её музыку?", a: "Иван Ларионов" },
      { q: "Как настоящее имя певицы Анны Асти?", a: "Анна Дзюба" },
      { q: "Кто написал песню «Кони привередливые»?", a: "Владимир Высоцкий" },
      { q: "Кто исполняет песню «Погода в доме»?", a: "Лариса Долина" },
      { q: "Какую песню Высоцкий написал для фильма «Вертикаль»?", a: "«Вершина» («Здесь вам не равнина»)" }
    ]
  },
  {
    category: "Классическая музыка",
    questions: [
      { q: "Кто написал «Времена года» для скрипки с оркестром?", a: "Антонио Вивальди" },
      { q: "Кто написал балет «Щелкунчик»?", a: "Пётр Чайковский" },
      { q: "Кто написал «Революционный этюд»?", a: "Фредерик Шопен" },
      { q: "Кто написал вальс «На прекрасном голубом Дунае»?", a: "Иоганн Штраус (сын)" },
      { q: "У какого композитора есть фортепианный цикл «Времена года»?", a: "Пётр Чайковский" }
    ]
  }
];

const VALUES = [100, 200, 300, 400, 500];
const TIMER_START = 30;
const TOTAL_CELLS = GAME_DATA.length * 5;

/* ============================================================
   ЗВУКИ
   ============================================================ */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function playTone(freq, startTime, duration, volume = 0.15, type = "sine") {
  const ctx = initAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  osc.connect(gain);
  gain.connect(ctx.destination);
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(volume, startTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.05);
}
function soundSuccess() {
  const now = initAudio().currentTime;
  playTone(523.25, now, 0.15, 0.18, "sine");
  playTone(783.99, now + 0.12, 0.25, 0.18, "sine");
}
function soundFail() {
  const now = initAudio().currentTime;
  playTone(311.13, now, 0.2, 0.15, "triangle");
  playTone(207.65, now + 0.15, 0.3, 0.15, "triangle");
}
function soundClick() {
  playTone(880, initAudio().currentTime, 0.06, 0.08, "sine");
}
function soundTimeUp() {
  const now = initAudio().currentTime;
  playTone(440, now, 0.2, 0.2, "square");
  playTone(440, now + 0.3, 0.2, 0.2, "square");
  playTone(440, now + 0.6, 0.3, 0.2, "square");
}
function soundFanfare() {
  const now = initAudio().currentTime;
  playTone(523.25, now, 0.2, 0.2, "sine");        // C5
  playTone(659.25, now + 0.15, 0.2, 0.2, "sine"); // E5
  playTone(783.99, now + 0.3, 0.2, 0.2, "sine");  // G5
  playTone(1046.5, now + 0.45, 0.5, 0.25, "sine"); // C6
}

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
let teams = [
  { name: "Команда 1", score: 0 },
  { name: "Команда 2", score: 0 },
  { name: "Команда 3", score: 0 }
];
let usedCells = new Set();
let currentCell = null;
let gameFinished = false;

let timerInterval = null;
let timeLeft = TIMER_START;
let timerRunning = false;

let gameTimerInterval = null;
let gameTimeLeft = 0;
let gameTimerRunning = false;

/* ============================================================
   ОТРИСОВКА
   ============================================================ */
function renderTeams() {
  const container = document.getElementById("teamsContainer");
  container.innerHTML = "";
  teams.forEach((team, i) => {
    const div = document.createElement("div");
    div.className = "team";
    div.innerHTML = `
      <input class="team-name" value="${team.name}" data-index="${i}" />
      <div class="team-score ${team.score < 0 ? 'negative' : ''}">${team.score}</div>
      <div class="team-controls">
        <button onclick="adjustScore(${i}, -50)">−</button>
        <button onclick="adjustScore(${i}, 50)">+</button>
      </div>
    `;
    container.appendChild(div);
  });
  document.querySelectorAll(".team-name").forEach(input => {
    input.addEventListener("input", (e) => {
      const idx = e.target.dataset.index;
      teams[idx].name = e.target.value;
    });
  });
}

function renderBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  GAME_DATA.forEach(cat => {
    const header = document.createElement("div");
    header.className = "cat-header";
    header.textContent = cat.category;
    board.appendChild(header);
  });
  for (let row = 0; row < 5; row++) {
    for (let cat = 0; cat < GAME_DATA.length; cat++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const key = `${cat}-${row}`;
      if (usedCells.has(key)) {
        cell.classList.add("used");
        cell.textContent = "✓";
      } else {
        cell.textContent = VALUES[row];
        cell.addEventListener("click", () => openQuestion(cat, row));
      }
      board.appendChild(cell);
    }
  }
}

/* ============================================================
   ТАЙМЕР ВОПРОСА
   ============================================================ */
function updateTimerDisplay() {
  const display = document.getElementById("timerDisplay");
  display.textContent = timeLeft;
  if (timeLeft <= 10) display.classList.add("warning");
  else display.classList.remove("warning");
}
function startTimer() {
  stopTimer();
  timerRunning = true;
  document.getElementById("pauseBtn").textContent = "⏸ Пауза";
  timerInterval = setInterval(() => {
    if (timeLeft > 0) {
      timeLeft--;
      updateTimerDisplay();
    } else {
      stopTimer();
      soundTimeUp();
    }
  }, 1000);
}
function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  timerRunning = false;
}
function pauseTimer() {
  if (timerRunning) {
    stopTimer();
    document.getElementById("pauseBtn").textContent = "▶ Продолжить";
  } else {
    if (timeLeft > 0) {
      timerRunning = true;
      document.getElementById("pauseBtn").textContent = "⏸ Пауза";
      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateTimerDisplay();
        } else {
          stopTimer();
          soundTimeUp();
        }
      }, 1000);
    }
  }
}
function resetTimer() {
  stopTimer();
  timeLeft = TIMER_START;
  updateTimerDisplay();
  document.getElementById("pauseBtn").textContent = "⏸ Пауза";
  startTimer();
}

/* ============================================================
   ОБЩИЙ ТАЙМЕР ИГРЫ
   ============================================================ */
function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}
function startGameTimer(minutes) {
  stopGameTimer();
  gameTimeLeft = minutes * 60;
  gameTimerRunning = true;
  const el = document.getElementById("gameTimer");
  el.classList.add("active");
  el.textContent = "⏱️ " + formatTime(gameTimeLeft);
  gameTimerInterval = setInterval(() => {
    if (gameTimeLeft > 0) {
      gameTimeLeft--;
      el.textContent = "⏱️ " + formatTime(gameTimeLeft);
      if (gameTimeLeft <= 60) el.classList.add("warning");
      else el.classList.remove("warning");
    } else {
      stopGameTimer();
      // Время игры вышло
      if (!gameFinished) {
        soundTimeUp();
        finishGame("time");
      }
    }
  }, 1000);
}
function stopGameTimer() {
  if (gameTimerInterval) clearInterval(gameTimerInterval);
  gameTimerInterval = null;
  gameTimerRunning = false;
  const el = document.getElementById("gameTimer");
  el.classList.remove("active", "warning");
}

/* ============================================================
   ВОПРОС
   ============================================================ */
function openQuestion(catIndex, rowIndex) {
  if (gameFinished) return;
  soundClick();
  const cat = GAME_DATA[catIndex];
  const question = cat.questions[rowIndex];
  const value = VALUES[rowIndex];
  currentCell = { cat: catIndex, row: rowIndex, value: value };

  document.getElementById("modalCat").textContent = cat.category;
  document.getElementById("modalValue").textContent = value + " очков";
  document.getElementById("modalQuestion").textContent = question.q;

  const answerEl = document.getElementById("modalAnswer");
  answerEl.textContent = "✅ " + question.a;
  answerEl.classList.remove("show");

  renderModalButtons(false);
  document.getElementById("modal").classList.add("active");

  timeLeft = TIMER_START;
  updateTimerDisplay();
  startTimer();
}

function renderModalButtons(showAward) {
  const btnContainer = document.getElementById("modalButtons");
  btnContainer.innerHTML = "";

  if (!showAward) {
    const btn = document.createElement("button");
    btn.textContent = "👁️ Показать ответ";
    btn.onclick = () => {
      document.getElementById("modalAnswer").classList.add("show");
      renderModalButtons(true);
    };
    btnContainer.appendChild(btn);

    const close = document.createElement("button");
    close.className = "close-btn";
    close.textContent = "✖ Закрыть (без очков)";
    close.onclick = () => { soundFail(); closeModal(true); };
    btnContainer.appendChild(close);
  } else {
    teams.forEach((team, i) => {
      const btn = document.createElement("button");
      btn.className = "award-btn";
      btn.textContent = `${team.name} +${currentCell.value}`;
      btn.onclick = () => awardPoints(i);
      btnContainer.appendChild(btn);
    });

    const close = document.createElement("button");
    close.className = "close-btn";
    close.textContent = "✖ Закрыть";
    close.onclick = () => { soundFail(); closeModal(true); };
    btnContainer.appendChild(close);
  }
}

function awardPoints(teamIndex) {
  soundSuccess();
  teams[teamIndex].score += currentCell.value;
  renderTeams();
  closeModal(true);
}

function closeModal(markUsed) {
  stopTimer();
  if (markUsed && currentCell) {
    usedCells.add(`${currentCell.cat}-${currentCell.row}`);
    renderBoard();

    // Проверка: все ли клетки открыты?
    if (usedCells.size === TOTAL_CELLS && !gameFinished) {
      setTimeout(() => finishGame("all"), 500);
    }
  }
  document.getElementById("modal").classList.remove("active");
  currentCell = null;
}

function adjustScore(teamIndex, delta) {
  teams[teamIndex].score += delta;
  renderTeams();
}

/* ============================================================
   ФИНАЛЬНЫЙ ЭКРАН
   ============================================================ */
function finishGame(reason = "manual") {
  if (gameFinished) return;
  gameFinished = true;
  stopTimer();
  stopGameTimer();

  // Закрываем модалку, если открыта
  document.getElementById("modal").classList.remove("active");
  currentCell = null;

  // Сортируем команды по очкам
  const sorted = [...teams]
    .map((t, i) => ({ ...t, idx: i }))
    .sort((a, b) => b.score - a.score);

  // Победитель
  const winnerDiv = document.getElementById("finalWinner");
  if (sorted[0].score === 0 && sorted[0].score === sorted[1].score) {
    winnerDiv.innerHTML = `
      <span class="crown">🤝</span>
      <div>Дружеская ничья!</div>
      <div style="font-size:1.1rem; margin-top:10px;">Все команды молодцы!</div>
    `;
  } else {
    winnerDiv.innerHTML = `
      <span class="crown">👑</span>
      <div>Победитель:</div>
      <div class="name">${sorted[0].name}</div>
      <div class="score">${sorted[0].score} очков</div>
    `;
  }

  // Таблица мест
  const standingsDiv = document.getElementById("finalStandings");
  standingsDiv.innerHTML = "";
  const medals = ["🥇", "🥈", "🥉", "4️⃣", "5️⃣"];
  sorted.forEach((team, i) => {
    const div = document.createElement("div");
    div.className = "standing" + (i === 0 ? " first" : "");
    div.innerHTML = `
      <span class="place">${medals[i] || (i+1) + "."}</span>
      <span class="tname">${team.name}</span>
      <span class="tscore">${team.score}</span>
    `;
    standingsDiv.appendChild(div);
  });

  // Показываем финальный экран
  document.getElementById("finalScreen").classList.add("active");

  // Фанфары + конфетти
  soundFanfare();
  createConfetti();
}

function createConfetti() {
  const screen = document.getElementById("finalScreen");
  // Удаляем старое конфетти
  screen.querySelectorAll(".confetti").forEach(el => el.remove());

  const colors = ["#ffd966", "#ff6b6b", "#8fff9e", "#8ab4f8", "#f8b4d9"];
  for (let i = 0; i < 50; i++) {
    const conf = document.createElement("div");
    conf.className = "confetti";
    conf.style.left = Math.random() * 100 + "%";
    conf.style.background = colors[Math.floor(Math.random() * colors.length)];
    conf.style.animationDuration = (3 + Math.random() * 4) + "s";
    conf.style.animationDelay = Math.random() * 3 + "s";
    conf.style.width = (6 + Math.random() * 8) + "px";
    conf.style.height = conf.style.width;
    screen.appendChild(conf);
  }
}

function closeFinal() {
  document.getElementById("finalScreen").classList.remove("active");
  // Не сбрасываем игру — можно пересмотреть финал, нажав кнопку "Завершить" ещё раз
}

function closeFinalAndReset() {
  document.getElementById("finalScreen").classList.remove("active");
  resetGame();
}

/* ============================================================
   УПРАВЛЕНИЕ
   ============================================================ */
function resetGame() {
  if (!confirm("Начать новую игру? Все очки и открытые клетки сбросятся.")) return;
  stopTimer();
  stopGameTimer();
  usedCells.clear();
  gameFinished = false;
  teams.forEach(t => t.score = 0);
  renderTeams();
  renderBoard();

  // Сброс финального экрана
  document.getElementById("finalScreen").classList.remove("active");
  document.getElementById("finalWinner").innerHTML = "";
  document.getElementById("finalStandings").innerHTML = "";

  // Запуск общего таймера, если включена галочка
  const useTimer = document.getElementById("useGameTimer").checked;
  if (useTimer) {
    const minutes = parseInt(document.getElementById("gameDuration").value) || 30;
    startGameTimer(minutes);
  }
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

// Кнопка "Завершить игру"
document.querySelector(".finish-btn").addEventListener("click", () => {
  if (confirm("Завершить игру и показать финальный экран?")) {
    finishGame("manual");
  }
});

// Запуск общего таймера при включении галочки
document.getElementById("useGameTimer").addEventListener("change", (e) => {
  if (e.target.checked) {
    const minutes = parseInt(document.getElementById("gameDuration").value) || 30;
    startGameTimer(minutes);
  } else {
    stopGameTimer();
  }
});

document.getElementById("gameDuration").addEventListener("change", (e) => {
  if (document.getElementById("useGameTimer").checked) {
    const minutes = parseInt(e.target.value) || 30;
    startGameTimer(minutes);
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal(true);
});

renderTeams();
renderBoard();
</script>
</body>
</html>
